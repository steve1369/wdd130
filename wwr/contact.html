<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sebastian Valle">
    <meta name="description" content="Contact the River Quest Rafting team via phone, email, or our online form to plan your next river trip.">
    <title>Contact Us - River Quest Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.png" alt="River Quest Rafting logo" width="100">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="company-info">
            <h1>River Quest Rafting</h1>
            <p>Pie de Gallo alto, Corani</p>
            <p>Cochabamba, Bolivia</p>
            <p>+591 772 303 78</p>
            <p>info@whitewater.com</p>
        </div>
        <div class="contact-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d51262.20727702239!2d-65.94365376640688!3d-17.263056788688335!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x93e3817f7a2b85f1%3A0x4b3b60ad5c2d1543!2sEl%20club%20del%20Lago%20-%20Corani!5e0!3m2!1ses!2sbo!4v1795883783276!5m2!1ses!2sbo" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
                <label for="email">Email</label><input type="email" id="email" name="email" placeholder="Your email" required>
                <fieldset class="purpose">
                    <legend>Message Purpose</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employees">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/employe 1.jpg" alt="Sarah Mitchell, rafting guide">
                <figcaption>Sarah Mitchell - Lead Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employe 2.jpg" alt="David Parker, rafting instructor">
                <figcaption>David Parker - Rafting Instructor</figcaption>
            </figure>
            <figure>
                <img src="images/employe 3.jpg" alt="Emily Carter, customer service representative">
                <figcaption>Emily Carter - Customer Service Representative</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©2026 River Quest Rafting Sebastian Valle</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram">
            </a>
            <a href="https://x.com">
                <img src="images/x-social-icon.jpg" alt="X">
            </a>
        </nav>
    </footer>
</body>

</html>
